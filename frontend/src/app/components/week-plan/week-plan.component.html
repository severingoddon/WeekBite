<div class="week-plan">
  <div class="header">
    <div class="header-top">
      <h2 class="gradient-text">Wochenplan</h2>
      <span class="week-label">{{ weekLabel }}</span>
    </div>
    <div class="header-actions">
      <button mat-icon-button (click)="openDatePicker()" aria-label="Datum wählen">
        <mat-icon>calendar_month</mat-icon>
      </button>
      @if (!isCurrentWeek) {
        <button mat-stroked-button class="action-btn" (click)="goToCurrentWeek()">
          Aktuell
        </button>
      }
      <button mat-stroked-button class="action-btn" (click)="createOrShowNextWeek()">
        {{ nextWeekExists ? 'Nächste Woche' : '+ Nächste Woche erstellen' }}
      </button>
      <button mat-icon-button color="warn" class="reset-btn" (click)="resetWeek()" aria-label="Woche leeren">
        <mat-icon>delete_sweep</mat-icon>
      </button>
    </div>
  </div>

  <!-- Hidden datepicker trigger -->
  <input matInput [matDatepicker]="picker" hidden (dateChange)="onDateSelected($event.value)">
  <mat-datepicker #picker></mat-datepicker>

  @for (weekDay of currentWeek?.days; track weekDay.id) {
    <mat-card class="day-card" [class.weekend]="weekDay.day === 'Samstag' || weekDay.day === 'Sonntag'" (click)="openMenuPopup(weekDay)">
      <mat-card-content class="day-content">
        <div class="day-info">
          <span class="day-name">{{ weekDay.day }}</span>
          @if (weekDay.menu) {
            <span class="menu-title">{{ weekDay.menu.title }}</span>
          } @else {
            <span class="menu-empty">Kein Menu gewählt</span>
          }
        </div>
        <div class="day-actions">
          @if (weekDay.menu) {
            <button mat-icon-button color="warn" (click)="removeMenu(weekDay, $event)" aria-label="Menu entfernen">
              <mat-icon>close</mat-icon>
            </button>
          }
          <mat-icon class="chevron">chevron_right</mat-icon>
        </div>
      </mat-card-content>
    </mat-card>
  }
</div>
