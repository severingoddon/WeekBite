<div class="shopping-page">
  <h2 class="gradient-text">Einkaufsliste</h2>

  <mat-card class="form-card">
    <mat-card-content>
      <div class="add-row">
        <mat-form-field class="quantity-field" appearance="outline" subscriptSizing="dynamic">
          <mat-label>Menge</mat-label>
          <input matInput [(ngModel)]="newQuantity" (keyup.enter)="addItem()" placeholder="z.B. 500g">
        </mat-form-field>
        <mat-form-field class="name-field" appearance="outline" subscriptSizing="dynamic">
          <mat-label>Artikel</mat-label>
          <input matInput [(ngModel)]="newName" (keyup.enter)="addItem()" placeholder="z.B. Tomaten">
        </mat-form-field>
        <button mat-flat-button class="add-btn" (click)="addItem()" [disabled]="!newName.trim()">
          Hinzufügen
        </button>
      </div>
    </mat-card-content>
  </mat-card>

  <mat-card class="form-card items-card">
    <mat-card-content>
      @if (items.length === 0) {
        <p class="empty-hint">Keine Artikel auf der Einkaufsliste.</p>
      }
      <mat-list>
        @for (item of items; track item.id) {
          @if (editingId === item.id) {
            <mat-list-item>
              <div class="edit-row">
                <mat-form-field class="quantity-field" appearance="outline" subscriptSizing="dynamic">
                  <input matInput [(ngModel)]="editQuantity" (keyup.enter)="saveEdit(item.id)" placeholder="Menge">
                </mat-form-field>
                <mat-form-field class="name-field" appearance="outline" subscriptSizing="dynamic">
                  <input matInput [(ngModel)]="editName" (keyup.enter)="saveEdit(item.id)">
                </mat-form-field>
                <button mat-icon-button (click)="saveEdit(item.id)">
                  <mat-icon>check</mat-icon>
                </button>
                <button mat-icon-button (click)="cancelEdit()">
                  <mat-icon>close</mat-icon>
                </button>
              </div>
            </mat-list-item>
          } @else {
            <mat-list-item>
              <span matListItemTitle class="item-text">
                @if (item.quantity) {
                  <span class="item-quantity">{{ item.quantity }}</span>
                }
                {{ item.name }}
              </span>
              <div matListItemMeta class="item-actions">
                <button mat-icon-button (click)="startEdit(item)">
                  <mat-icon>edit</mat-icon>
                </button>
                <button mat-icon-button (click)="deleteItem(item.id)">
                  <mat-icon>delete</mat-icon>
                </button>
              </div>
            </mat-list-item>
          }
          <mat-divider></mat-divider>
        }
      </mat-list>
    </mat-card-content>
  </mat-card>
</div>
